<style>
  :root {
    --bg: #F4F2EE;
    --surface: #FFFFFF;
    --surface-2: #FAF8F5;
    --sunken: #ECE8E2;
    --ink: #2E2418;
    --ink-soft: #5B4A3A;
    --ink-faint: #7A6B5C;
    --line: #E3DDD4;
    --line-strong: #CFC5B7;
    --accent: #4F826F;
    --accent-strong: #3F6B5B;
    --accent-soft: #E3EEE9;
    --on-accent: #FFFFFF;
    --gold: #AC793D;
    --gold-ink: #8F6230;
    --danger: #A8453B;
    --danger-soft: #F6E4E1;
    --tint-green: #E8EFEA;
    --tint-sand: #F5EDE2;
    --tint-sky: #E8EEF2;
    --tint-rose: #F5E7E4;
    --tint-lilac: #EEECF4;
    --icon-green: #4F826F;
    --icon-sand: #AC793D;
    --icon-sky: #4E6E86;
    --icon-rose: #A5584A;
    --icon-lilac: #6A6490;
    --shadow: 0 1px 2px rgba(46,36,24,.05), 0 8px 24px -16px rgba(46,36,24,.22);
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    --bg: #1C1712; --surface: #251E17; --surface-2: #2A221A; --sunken: #17120D;
    --ink: #EFE9E1; --ink-soft: #CBBFAF; --ink-faint: #9C8E7E;
    --line: #3A3027; --line-strong: #4A3E33;
    --accent: #7FB5A1; --accent-strong: #9CCBB9; --accent-soft: #24382F; --on-accent: #1C1712;
    --gold: #DCA360; --gold-ink: #DCA360;
    --danger: #E08A7D; --danger-soft: #3E211D;
    --tint-green: #22302A; --tint-sand: #33291D; --tint-sky: #202A31; --tint-rose: #352320; --tint-lilac: #2A2733;
    --icon-green: #8CC2AE; --icon-sand: #DCA360; --icon-sky: #9DB8CC; --icon-rose: #E0A193; --icon-lilac: #B5AEDB;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.6);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C1712; --surface: #251E17; --surface-2: #2A221A; --sunken: #17120D;
      --ink: #EFE9E1; --ink-soft: #CBBFAF; --ink-faint: #9C8E7E;
      --line: #3A3027; --line-strong: #4A3E33;
      --accent: #7FB5A1; --accent-strong: #9CCBB9; --accent-soft: #24382F; --on-accent: #1C1712;
      --gold: #DCA360; --gold-ink: #DCA360;
      --danger: #E08A7D; --danger-soft: #3E211D;
      --tint-green: #22302A; --tint-sand: #33291D; --tint-sky: #202A31; --tint-rose: #352320; --tint-lilac: #2A2733;
      --icon-green: #8CC2AE; --icon-sand: #DCA360; --icon-sky: #9DB8CC; --icon-rose: #E0A193; --icon-lilac: #B5AEDB;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 26px -16px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Montserrat", -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, h4 { margin: 0; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent-strong); }
  [hidden] { display: none !important; }
  .icon { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .quote { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500; font-size: 15px; line-height: 1.35; color: var(--ink-soft); }

  /* ---------- botões ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-block { width: 100%; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--sunken); }
  .link-btn { background: none; border: 0; padding: 0; color: var(--ink-soft); font-weight: 600; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-soft); position: relative; }

  /* ---------- formulários ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
  .input, select.input, textarea.input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .hint { font-size: 12px; color: var(--ink-faint); margin: -6px 0 14px; }
  .msg-error { background: var(--danger-soft); color: var(--danger); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .msg-ok { background: var(--accent-soft); color: var(--accent-strong); padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }

  /* ---------- login ---------- */
  .auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .auth-card { position: relative; width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px 28px 26px; box-shadow: var(--shadow); }
  .auth-logo { display: block; width: 100%; max-width: 250px; height: auto; margin: 4px 0 18px; }
  .auth-lede { color: var(--ink-soft); margin: 0 0 18px; }
  .auth-links { text-align: center; margin-top: 14px; }
  .theme-float { position: absolute; top: 12px; right: 12px; }

  /* ---------- estrutura ---------- */
  .app { display: flex; min-height: 100vh; }
  @media (min-width: 821px) { .app { background: linear-gradient(to right, var(--surface-2) 250px, transparent 250px); } }
  .sidebar { width: 250px; flex-shrink: 0; background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 16px; position: sticky; top: 0; height: 100vh; }
  .sidebar-logo { display: block; width: 100%; max-width: 180px; height: auto; margin: 0 6px 22px; }
  .nav { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 0; background: none; color: var(--ink); font-weight: 600; font-size: 12.5px; letter-spacing: .03em; text-transform: uppercase; text-align: left; cursor: pointer; line-height: 1.3; }
  .nav-item:hover { background: var(--sunken); }
  .nav-item.active { background: var(--tint-green); color: var(--accent-strong); }
  :root[data-theme="dark"] .nav-item.active { color: var(--icon-green); }
  .nav-item .lock { margin-left: auto; width: 15px; height: 15px; color: var(--ink-faint); }
  .sidebar-foot { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .profile-mini { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; border: 0; background: none; cursor: pointer; text-align: left; width: 100%; }

  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--sunken); color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; border: 1px solid var(--line); }
  .profile-mini-name { font-weight: 600; font-size: 13px; display: block; }
  .profile-mini-sub { font-size: 11.5px; color: var(--ink-faint); display: block; }
  .main { flex: 1; min-width: 0; padding: 26px 32px 40px; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  .page-title { font-size: 28px; font-weight: 600; }
  .page-sub { color: var(--ink-soft); margin-top: 2px; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .badge-dot { position: absolute; top: 7px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .mobile-toggle { display: none; }

  /* ---------- cartões ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }

  .stat { border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; border: 1px solid transparent; min-height: 170px; }
  .stat-head { display: flex; align-items: center; gap: 10px; min-height: 36px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }

  .t-sand { background: var(--tint-sand); } .t-sand .stat-head .icon { color: var(--icon-sand); }
  .t-sky { background: var(--tint-sky); } .t-sky .stat-head .icon { color: var(--icon-sky); }
  .t-rose { background: var(--tint-rose); } .t-rose .stat-head .icon { color: var(--icon-rose); }
  .t-lilac { background: var(--tint-lilac); } .t-lilac .stat-head .icon { color: var(--icon-lilac); }

  /* ---------- Início: busca ---------- */
  .hero { background: var(--tint-green); border-radius: 18px; padding: 26px 28px; display: grid; grid-template-columns: 220px 1fr 190px; gap: 24px; align-items: center; margin-bottom: 18px; }
  .hero h2 { font-size: 21px; line-height: 1.25; }
  .hero p { color: var(--ink-soft); font-size: 13px; margin: 8px 0 0; }
  .searchbar { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
  .searchbar input { flex: 1; border: 0; background: transparent; outline: none; padding: 8px 0; min-width: 0; }
  .searchbar .icon { color: var(--ink-faint); }
  .chips-label { font-size: 12px; color: var(--ink-soft); margin: 12px 0 8px; }

  /* ---------- listas ---------- */
  .tabs { display: inline-flex; max-width: 100%; overflow-x: auto; gap: 4px; background: var(--sunken); padding: 4px; border-radius: 10px; margin-bottom: 14px; }

  .tab.active { background: var(--accent); color: var(--on-accent); }
  .empty { text-align: center; padding: 26px 12px; color: var(--ink-soft); }

  .empty strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
  .empty p { margin: 0 0 14px; font-size: 12.5px; }
  .list-item { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
  .list-item:last-child { border-bottom: 0; }
  .list-item:hover { background: var(--surface-2); }

  .list-main { flex: 1; min-width: 0; }
  .list-title { font-weight: 600; font-size: 13px; display: block; }
  .list-sub { font-size: 11.5px; color: var(--ink-faint); display: block; }
  .date-box { width: 46px; flex-shrink: 0; text-align: center; background: var(--sunken); border-radius: 10px; padding: 6px 0; line-height: 1.1; }
  .date-box b { display: block; font-size: 17px; }
  .date-box span { font-size: 10.5px; font-weight: 700; text-transform: uppercase; color: var(--ink-soft); }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tool { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .tool:hover { border-color: var(--accent); }
  .tool .icon { width: 22px; height: 22px; color: var(--ink-soft); margin-bottom: 6px; }
  .tool b { font-size: 13px; font-weight: 600; }
  .tool span { font-size: 11.5px; color: var(--ink-faint); }

  /* ---------- páginas em construção ---------- */
  .soon { max-width: 640px; margin: 20px auto; text-align: center; padding: 40px 28px; }
  .soon .icon { width: 44px; height: 44px; color: var(--accent); margin-bottom: 12px; }
  .soon h3 { font-size: 19px; margin-bottom: 8px; }
  .soon p { color: var(--ink-soft); margin: 0 0 6px; }
  .pill { display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--tint-sand); color: var(--gold-ink); font-size: 11.5px; font-weight: 700; margin-bottom: 14px; }

  /* ---------- modais e menus ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(28,23,18,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal { background: var(--surface); border-radius: 18px; width: 100%; max-width: 520px; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 60px -20px rgba(0,0,0,.5); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 6px; }
  .modal-head h3 { font-size: 18px; }
  .modal-body { padding: 12px 22px 8px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 22px 20px; }
  .popover { position: absolute; top: 48px; right: 0; width: 340px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); z-index: 40; overflow: hidden; }
  .popover-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .notif { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .notif:last-child { border-bottom: 0; }
  .notif.unread { background: var(--tint-green); }
  .notif b { font-size: 13px; font-weight: 600; display: block; }
  .notif span { font-size: 12px; color: var(--ink-soft); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 500; z-index: 60; box-shadow: var(--shadow); }
  .theme-btn .i-sun { display: none; }
  :root[data-theme="dark"] .theme-btn .i-sun { display: inline; }
  :root[data-theme="dark"] .theme-btn .i-moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-btn .i-sun { display: inline; }
    :root:not([data-theme="light"]) .theme-btn .i-moon { display: none; }
  }
  .loading { color: var(--ink-faint); font-size: 12.5px; padding: 12px 0; }

  /* ---------- responsivo ---------- */

  /* ================= ETAPA 2: casos e mapa ================= */
  .page-actions { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-sm { min-height: 0; padding: 14px 16px; gap: 2px; }
  .stat-sm .stat-num { font-size: 24px; margin-top: 2px; }
  .stat-sm .link-btn { margin-top: 6px; color: var(--ink); }
  .layout-side { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  .side-col { display: flex; flex-direction: column; gap: 16px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 16px 0 14px; flex-wrap: wrap; }
  .toolbar .searchbar { flex: 1; min-width: 220px; padding: 3px 12px; }
  .toolbar select.input { width: auto; padding: 9px 12px; }
  .table-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }

  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--sunken); color: var(--ink-soft); margin: 2px 4px 2px 0; }
  .tag-hip { background: var(--tint-sky); color: var(--icon-sky); }
  .tag-conf { background: var(--tint-lilac); color: var(--icon-lilac); }
  .tag-obs { background: var(--tint-sand); color: var(--gold-ink); }
  .menu-btn { width: 32px; height: 32px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: var(--ink-soft); font-size: 18px; line-height: 1; }
  .menu-btn:hover { background: var(--sunken); }
  .row-menu { position: absolute; right: 8px; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 190px; }
  .row-menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .row-menu button:hover { background: var(--sunken); }
  .row-menu .danger { color: var(--danger); }
  .donut-wrap { display: flex; align-items: center; gap: 16px; }
  .legend { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; flex: 1; }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend b { margin-left: auto; }

  .pend span { font-size: 12px; color: var(--ink-faint); }

  .shortcuts { display: grid; grid-template-columns: repeat(3, 1fr) 1.1fr; gap: 14px; margin-top: 18px; }

  /* modal de formulário */

  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }

  .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-faint); margin: 18px 0 10px; }

  /* mapa */
  .case-head { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; margin-bottom: 16px; }

  .ov-grid { display: grid; grid-template-columns: 1.35fr 1fr 250px; gap: 16px; }
  .ov-grid-2 { display: grid; grid-template-columns: 1.35fr 1fr 250px; gap: 16px; margin-top: 16px; }

  .tl-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; }
  .tl-top span { font-weight: 500; font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }

  .reg-actions { display: flex; gap: 12px; margin-top: 8px; }
  .dom-toggle { display: flex; flex-wrap: wrap; gap: 6px; }
  .dom-toggle label { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; cursor: pointer; user-select: none; }
  .dom-toggle input { display: none; }

  .dom-toggle label.on { background: var(--tint-green); border-color: var(--accent); color: var(--accent-strong); }
  .plan-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .plan-item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .plan-item:last-child { border-bottom: 0; }
  .plan-item .x { margin-left: auto; border: 0; background: none; color: var(--ink-faint); cursor: pointer; font-size: 16px; }
  .plan-add { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .plan-add .input { flex: 1; min-width: 120px; }
  .doc-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .doc-row:last-child { border-bottom: 0; }
  .doc-editor { width: 100%; min-height: 380px; font-size: 13.5px; line-height: 1.6; }
  .note { font-size: 12px; color: var(--ink-soft); background: var(--surface-2); border: 1px dashed var(--line-strong); border-radius: 10px; padding: 10px 12px; }
  .ai-btn { color: var(--accent-strong); border-color: var(--accent-soft); background: var(--tint-green); }
  @media (max-width: 1180px) {
    .layout-side { grid-template-columns: 1fr; }
    .shortcuts { grid-template-columns: 1fr 1fr; }
    .ov-grid, .ov-grid-2 { grid-template-columns: 1fr 1fr; }
    .plan-cols { grid-template-columns: 1fr; }
  }
  @media (max-width: 820px) {
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .shortcuts, .ov-grid, .ov-grid-2 { grid-template-columns: 1fr; }
    .case-head { grid-template-columns: auto 1fr; }
    .case-head > .btn { grid-column: 1 / -1; }
    .dom-map { grid-template-columns: 1fr; }
    .check-grid { grid-template-columns: 1fr; }
    .tag-editor-row { grid-template-columns: 1fr 36px; }
    .tag-editor-row select { grid-column: 1 / 2; }
    .page-actions .btn span { display: none; }
    .hide-sm { display: none; }
    .topbar { flex-wrap: wrap; }
    .topbar > div:first-child { flex: 1 1 100%; order: 2; }
    .topbar-actions { order: 1; width: 100%; justify-content: flex-end; }
    #trocaCaso { min-width: 0 !important; max-width: 58vw; }
    .main, .layout-side > div, .card { min-width: 0; }
  }

  @media (max-width: 1180px) {
    .grid-5 { grid-template-columns: repeat(3, 1fr); }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .hero { grid-template-columns: 1fr; }
    .hero-quote { display: none; }
  }
  @media (max-width: 820px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 30; flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .sidebar-logo { max-width: 130px; margin: 0; }
    .mobile-toggle { display: inline-flex; }
    .sidebar-panel { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--surface-2); border-bottom: 1px solid var(--line); padding: 10px 14px 16px; box-shadow: var(--shadow); }
    .sidebar.open .sidebar-panel { display: flex; flex-direction: column; }
    .main { padding: 18px 16px 32px; }
    .page-title { font-size: 23px; }
    .grid-5, .grid-3 { grid-template-columns: 1fr; }
    .stat { min-height: 0; }
    .hero { padding: 20px 18px; }
    .form-row { grid-template-columns: 1fr; }
    .popover { position: fixed; top: 64px; left: 12px; right: 12px; width: auto; }
    .searchbar { flex-wrap: wrap; padding: 6px 6px 6px 12px; }
    .searchbar input { flex-basis: calc(100% - 40px); }
    .searchbar .btn { width: 100%; }
  }
  @media (min-width: 821px) {
    .sidebar-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  }
</style>
</head>

      var row = {

        escola: fval(form, "escola") || null, status: fval(form, "status"), responsaveis: fval(form, "responsaveis") || null,

        dominios_ativos: DOMINIOS.filter(function (d) { return fval(form, "dom_" + d.k); }).map(function (d) { return d.k; }),

      p.then(function (res) {
        if (fail(res)) { btn.disabled = false; return; }

        if (!fotoFile) { close(); onSaved(saved); return; }
        var ext = (fotoFile.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        var path = state.user.id + "/casos/" + saved.id + "/foto-" + Date.now() + "." + ext;

          if (c.foto_path) sb.storage.from("ncc-arquivos").remove([c.foto_path]);
          sb.from("casos").update({ foto_path: path }).eq("id", saved.id).select().maybeSingle().then(function (r2) { close(); onSaved(r2.data || saved); });
        });
      });
    }
  }

    documentos: function (el, c, reabrir) {
      sb.from("documentos_caso").select("*").eq("caso_id", c.id).order("created_at", { ascending: false }).then(function (res) {
        var docs = res.data || [], rels = docs.filter(function (d) { return d.tipo !== "anexo"; }), anexos = docs.filter(function (d) { return d.tipo === "anexo"; });
        el.innerHTML =
          (c.relatorio_escola_solicitado ? '<div class="msg-ok" style="background:var(--tint-sand);color:var(--gold-ink)">A escola solicitou um relatório. Ao gerar o relatório para a escola, esta pendência sai da lista.</div>' : "") +
          '<div class="layout-side"><div>' +
            '<div class="card" style="margin-bottom:16px"><h3 class="card-title" style="margin-bottom:12px;display:flex;gap:8px;align-items:center">' + icon("sparkle") + 'Gerar relatório com IA</h3>' +
              '<form id="relForm"><div class="form-row" style="grid-template-columns:1.4fr 1fr 1fr"><div class="field"><label>Para quem</label><select class="input" name="tipo"><option value="relatorio_familia">Família</option><option value="relatorio_escola"' + (c.relatorio_escola_solicitado ? " selected" : "") + '>Escola</option><option value="relatorio_equipe">Equipe multidisciplinar</option></select></div>' +
              '<div class="field"><label>De</label><input class="input" type="date" name="inicio"></div><div class="field"><label>Até</label><input class="input" type="date" name="fim"></div></div>' +
              '<p class="hint">A IA usa somente os registros, avaliações e o plano deste caso no período, e mantém como hipótese tudo o que não tiver diagnóstico confirmado. Você revisa e edita antes de salvar.</p>' +
              '<button type="submit" class="btn btn-primary" id="relBtn">' + icon("sparkle") + " Gerar rascunho</button></form></div>" +
            '<div class="card"><h3 class="card-title" style="margin-bottom:6px">Relatórios</h3>' +
              (rels.length ? rels.map(function (d) { return '<div class="doc-row"><span class="list-ico t-sky" style="color:var(--icon-sky)">' + icon("doc") + '</span><div class="list-main"><span class="list-title">' + esc(d.titulo) + '</span><span class="list-sub">' + esc(TIPO_DOC[d.tipo]) + " · " + fmtDataHora(d.created_at) + " · " + (d.status === "enviado" ? "enviado" : d.status === "rascunho" ? "rascunho" : "gerado") + '</span></div><button type="button" class="btn" data-open="' + d.id + '" style="padding:6px 12px">Abrir</button></div>'; }).join("") : '<p class="hint" style="margin:6px 0 0">Nenhum relatório salvo.</p>') +
            "</div></div>" +
            '<div class="card"><h3 class="card-title" style="margin-bottom:6px">Anexos</h3><p class="hint" style="margin:0 0 10px">PDFs, imagens e documentos do caso (até 25 MB). Armazenamento privado.</p>' +
              '<label class="btn btn-block" style="cursor:pointer">' + icon("upload") + ' Enviar arquivo<input type="file" id="anexoFile" hidden></label>' +
              (anexos.length ? anexos.map(function (d) { return '<div class="doc-row">' + icon("clip") + '<div class="list-main"><span class="list-title" style="word-break:break-all">' + esc(d.titulo) + '</span><span class="list-sub">' + fmtDataHora(d.created_at) + '</span></div><button type="button" class="link-btn" data-dl="' + d.id + '">Baixar</button><button type="button" class="link-btn" data-rmx="' + d.id + '" style="color:var(--danger)">' + icon("trash") + "</button></div>"; }).join("") : '<p class="hint" style="margin:12px 0 0">Nenhum anexo.</p>') +
            "</div></div>";

        $("relForm").onsubmit = function (e) {
          e.preventDefault(); var f = this, b = $("relBtn");
          var tipo = fval(f, "tipo"); b.disabled = true; b.innerHTML = icon("sparkle") + " Gerando… (pode levar até 1 minuto)";
          invokeIA({ action: "gerar_relatorio", caso_id: c.id, tipo: tipo, inicio: fval(f, "inicio") || null, fim: fval(f, "fim") || null }).then(function (t) {
            abrirDoc({ tipo: tipo, titulo: TIPO_DOC[tipo] + " — " + c.nome + " — " + fmtData(todayIso()), conteudo: t, status: "rascunho" });
          }, function (err) { toast(err.message); }).then(function () { b.disabled = false; b.innerHTML = icon("sparkle") + " Gerar rascunho"; });
        };
        el.querySelectorAll("[data-open]").forEach(function (b) { b.onclick = function () { abrirDoc(rels.filter(function (d) { return d.id === b.getAttribute("data-open"); })[0]); }; });
        $("anexoFile").onchange = function () {
          var file = this.files[0]; if (!file) return;
          if (file.size > 25 * 1024 * 1024) { toast("O arquivo deve ter até 25 MB."); return; }
          var safe = file.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_");
          var path = state.user.id + "/casos/" + c.id + "/anexos/" + Date.now() + "-" + safe;
          toast("Enviando…");
          sb.storage.from("ncc-arquivos").upload(path, file, { contentType: file.type || "application/octet-stream" }).then(function (up) {
            if (up.error) { toast("Não foi possível enviar: " + up.error.message); return; }
            sb.from("documentos_caso").insert({ owner_id: state.user.id, caso_id: c.id, tipo: "anexo", titulo: file.name, arquivo_path: path, status: "gerado" }).then(function (r) { if (!fail(r)) { toast("Arquivo anexado."); reabrir(); } });
          });
        };
        el.querySelectorAll("[data-dl]").forEach(function (b) { b.onclick = function () { var d = anexos.filter(function (x) { return x.id === b.getAttribute("data-dl"); })[0]; signedUrl(d.arquivo_path).then(function (u) { if (u) window.open(u, "_blank", "noopener"); else toast("Não foi possível abrir o arquivo."); }); }; });
        el.querySelectorAll("[data-rmx]").forEach(function (b) { b.onclick = function () { var d = anexos.filter(function (x) { return x.id === b.getAttribute("data-rmx"); })[0]; openModal("Excluir anexo", "<p>Excluir <b>" + esc(d.titulo) + "</b>?</p>", { ok: "Excluir", onSubmit: function (f, close) { sb.storage.from("ncc-arquivos").remove([d.arquivo_path]).then(function () { sb.from("documentos_caso").delete().eq("id", d.id).then(function (r) { if (!fail(r)) { close(); reabrir(); } }); }); } }); }; });
      });

      function abrirDoc(d) {
        var m = openModal(d.id ? "Relatório" : "Revise o rascunho", '<div class="field"><label>Título</label><input class="input" name="titulo" value="' + esc(d.titulo) + '"></div><div class="field"><label>Texto</label><textarea class="input doc-editor" name="conteudo">' + esc(d.conteudo || "") + '</textarea></div>' + (d.id ? '<label class="check"><input type="checkbox" name="enviado"' + (d.status === "enviado" ? " checked" : "") + "> Já enviado</label>" : '<p class="hint">Rascunho gerado por IA a partir dos dados do caso. Confira todas as informações antes de salvar e enviar.</p>'), {
          lg: true,
          foot: (d.id ? '<button type="button" class="btn btn-ghost" data-delrel style="margin-right:auto;color:var(--danger)">' + icon("trash") + " Excluir</button>" : "") + '<button type="button" class="btn" data-print>' + icon("printer") + ' Imprimir / PDF</button><button type="button" class="btn" data-copy>Copiar</button><button type="submit" class="btn btn-primary">Salvar</button>',
          onSubmit: function (f, close) {
            var row = { titulo: fval(f, "titulo") || d.titulo, conteudo: fval(f, "conteudo"), status: d.id ? (fval(f, "enviado") ? "enviado" : "gerado") : "gerado" };
            var p = d.id ? sb.from("documentos_caso").update(row).eq("id", d.id) : sb.from("documentos_caso").insert(Object.assign({ owner_id: state.user.id, caso_id: c.id, tipo: d.tipo }, row));
            p.then(function (r) {
              if (fail(r)) return;
              if (d.tipo === "relatorio_escola" && c.relatorio_escola_solicitado) { sb.from("casos").update({ relatorio_escola_solicitado: false }).eq("id", c.id).then(function () {}); c.relatorio_escola_solicitado = false; }
              close(); toast("Relatório salvo."); reabrir();
            });
          }
        });
        m.el.querySelector("[data-copy]").onclick = function () { var t = m.form.querySelector("[name=conteudo]").value; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast("Texto copiado."); }, function () { toast("Não foi possível copiar."); }); };
        m.el.querySelector("[data-print]").onclick = function () { imprimir(fval(m.form, "titulo"), m.form.querySelector("[name=conteudo]").value); };
        var dr = m.el.querySelector("[data-delrel]");
        if (dr) dr.onclick = function () { if (!confirm("Excluir este relatório?")) return; sb.from("documentos_caso").delete().eq("id", d.id).then(function (r) { if (!fail(r)) { m.close(); toast("Relatório excluído."); reabrir(); } }); };
      }
      function imprimir(titulo, texto) {
        var p = state.profile || {};
        var w = window.open("", "_blank"); if (!w) { toast("Permita pop-ups para imprimir."); return; }
        var logo = document.querySelector(".sidebar-logo").src;
        w.document.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>' + esc(titulo) + '</title><style>body{font-family:Montserrat,Arial,sans-serif;color:#2E2418;max-width:720px;margin:32px auto;padding:0 24px;font-size:13.5px;line-height:1.65}img{width:170px}h1{font-size:18px;margin:18px 0 4px}.meta{color:#7A6B5C;font-size:12px;margin-bottom:20px;border-bottom:1px solid #E3DDD4;padding-bottom:12px}.txt{white-space:pre-wrap}.ass{margin-top:48px;border-top:1px solid #2E2418;width:280px;padding-top:6px;font-size:12px}@media print{body{margin:0}}</style></head><body><img src="' + logo + '" alt="NCC Integração"><h1>' + esc(titulo) + '</h1><div class="meta">' + esc(p.name || "") + (profileSubline(p) !== "Complete seu perfil" ? " · " + esc(profileSubline(p)) : "") + " · Emitido em " + fmtData(todayIso()) + '</div><div class="txt">' + esc(texto) + '</div><div class="ass">' + esc(p.name || "") + "<br>" + esc(profileSubline(p) === "Complete seu perfil" ? "" : profileSubline(p)) + "</div><script>window.onload=function(){window.print()}<\/script></body></html>");
        w.document.close();
      }
    }
  };

  function stat(tint, ic, label, num, sub, btnLabel, btnIcon, go) {
    return '<div class="stat ' + tint + '"><div class="stat-head">' + icon(ic) + "<span>" + esc(label) + '</span></div><div class="stat-num">' + num + '</div><div class="stat-sub">' + sub + '</div><button type="button" class="btn btn-block" data-go="' + go + '">' + (btnIcon ? icon(btnIcon) : "") + esc(btnLabel) + "</button></div>";
  }
  function tool(ic, title, sub, go) { return '<button type="button" class="tool" data-go="' + go + '">' + icon(ic) + "<b>" + esc(title) + "</b><span>" + esc(sub) + "</span></button>"; }

  /* ================= INICIALIZAÇÃO ================= */
  function enterApp(user) {
    state.user = user;
    show("authScreen", false); show("appScreen", true);
    loadProfile().then(function () { render(); });
    loadNotifs();
    sincronizarAlertas();
  }

  if (!sb) {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif">Não foi possível carregar a plataforma. Verifique sua conexão e recarregue a página.</div>';
    return;
  }

  var isRecovery = /type=(recovery|invite)/.test(location.hash) || /type=(recovery|invite)/.test(location.search);
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY") { showAuth("setpass"); }
  });
  sb.auth.getSession().then(function (res) {
    var session = res.data && res.data.session;
    if (isRecovery && session) { showAuth("setpass"); return; }
    if (session) enterApp(session.user); else showAuth("login");
  });
})();
</script>
</body>
</html>
